# The analysis environment: CLUE, scoring and figures. No GPU, no hepattn.
#
#   conda env create -f environment.yml
#   conda activate calo-clustering
#
# Versions are pinned because the clustering output depends on them, CLUEstering in particular
# determining the labels the whole analysis is built on.

name: calo-clustering
channels:
  - conda-forge
dependencies:
  - python=3.11

  # Data handling and numerics
  - numpy=2.4.6
  - pandas=3.0.3
  - scipy=1.17.1
  - pyarrow=24.0.0
  - pyyaml

  # Clustering, optimisation and jets
  - optuna=4.9.0
  - fastjet=3.5.1.3

  # A CLUEstering dependency, taken from conda rather than left to pip: there is no
  # scikit-learn wheel for this python/numpy combination, so pip falls back to a source build
  # and the install fails outright.
  - scikit-learn

  # Figures. scienceplots supplies the `science` style applied in src/plotting/; nothing else
  # imports it, and a missing install degrades to matplotlib's defaults rather than failing.
  - matplotlib=3.10.9
  - scienceplots=2.2.2

  # setup/download_data.py imports this and nothing else.
  - huggingface_hub

  # Testing and linting
  - pytest
  - ruff

  # Build tools for the CLUEstering CPU backends.
  #
  # libboost and libboost-headers rather than the `boost` metapackage: CLUEstering 2.11.0's
  # CMakeLists does `find_package(Boost COMPONENTS atomic)`, so it links a compiled Boost
  # library and headers alone are not enough. `boost` would also pull libboost-python, which
  # pins an icu that does not co-solve with pyarrow 24 / pandas 3 on this platform.
  - libboost-headers
  - libboost
  - cmake
  - ninja
  - cxx-compiler

  - pip
  - pip:
      - CLUEstering==2.11.0
