# Environment for the calorimeter clustering comparison.
#
#   conda env create -f environment.yml
#   conda activate calo-clustering
#
# Versions are pinned because the clustering output depends on them; CLUEstering
# in particular determines the labels the whole analysis is built on.

name: calo-clustering
channels:
  - conda-forge
dependencies:
  - python=3.11

  # Data handling and numerics
  - numpy=2.4.6
  - pandas=3.0.3
  - scipy=1.17.1
  - pyarrow=24.0.0
  - pyyaml

  # Clustering, optimisation and jets
  - optuna=4.9.0
  - fastjet=3.5.1.3

  # A CLUEstering dependency, taken from conda rather than left to pip: there is no
  # scikit-learn wheel for this python/numpy combination, so pip falls back to building it
  # from source and the install fails outright.
  - scikit-learn

  # Figures
  - matplotlib=3.10.9
  # Matplotlib style sheets for publication figures. Supplies the `science` and `nature`
  # styles applied in src/plotting/style.py: serif-free tick-in-on-all-sides axes, hairline
  # spines and a compact figure size, which is what makes the figures look native to a thesis
  # rather than to a notebook. It ships styles and nothing else, so nothing imports it beyond
  # style.py, and a missing install degrades to matplotlib's defaults rather than failing.
  - scienceplots=2.2.2

  # Dataset download. setup/download_data.py imports huggingface_hub and nothing else, and its
  # docstring already claimed this environment provides it -- it did not, and a fresh clone hit
  # ModuleNotFoundError on the first command the README tells you to run. Added 2026-08-11.
  - huggingface_hub

  # Testing
  - pytest

  # Build tools needed to compile the CLUEstering CPU backends.
  #
  # libboost-headers, not boost: the CLUE kernels only ever include Boost headers,
  # while the `boost` metapackage additionally pulls libboost-python, which pins an
  # icu that no longer co-solves with pyarrow 24 / pandas 3 on this platform. Boost
  # for linux-64 also stops at 1.85 in the `boost` form, whereas the header-only
  # package tracks 1.91, so this is both the smaller and the newer dependency.
  - libboost-headers
  # libboost as well as libboost-headers, and the comment above was measured wrong on one point:
  # CLUEstering 2.11.0's CMakeLists does `find_package(Boost COMPONENTS atomic)`, i.e. it links a
  # COMPILED Boost library, not just headers. With libboost-headers alone the wheel build fails:
  #     Could NOT find Boost (missing: atomic) (found suitable version "1.91.0")
  # libboost is the compiled libraries WITHOUT the python bindings, so it fixes this while keeping
  # the reason libboost-headers was chosen over `boost` intact -- it does not pull libboost-python
  # and so does not drag in the icu that fails to co-solve with pyarrow 24 / pandas 3. Measured:
  # it resolves as a single 3.1 MB package with no other changes to the environment.
  - libboost
  - cmake
  - ninja
  - cxx-compiler

  - pip
  - pip:
      # colliderml is deliberately absent. It existed to decode raw ColliderML parquet, but
      # this repository no longer opens one: both algorithms read the event store dumped by
      # hepattn, which is what makes "CLUE and MaskFormer saw identical cells" structural.
      # It also drags in h5py, which has no wheel here and fails to build against the
      # system HDF5.
      - CLUEstering==2.11.0
