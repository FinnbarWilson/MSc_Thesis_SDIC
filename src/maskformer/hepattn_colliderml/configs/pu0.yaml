# ColliderML calorimeter clustering -- pileup 0, full detector.
#
#   cd <hepattn checkout>/src/hepattn/experiments/colliderml
#   python main.py fit --config configs/pu0.yaml
#
# SELF-CONTAINED. There are exactly two configs in this directory, one per pileup condition, and
# neither is an overlay on the other. That is deliberate: the overlay stack that used to live here
# meant the objective a run actually used depended on the ORDER of four --config flags, and
# `tasks` is a YAML list, so any overlay touching it silently replaced the whole list rather than
# merging into it. One file per run removes that class of mistake entirely.
#
# The two files are identical except where the data forces a difference, and those places are
# marked "PU200 DIFFERS" / "PU0 DIFFERS". Keep them in sync by hand; a diff of the two is short
# and is the intended way to see what pileup changes.
#
# THE TRUTH DEFINITION IS SHOWER-LEVEL. `particle_collapse_shower_secondaries: true` makes one
# target per particle ENTERING the calorimeter rather than per Geant particle depositing in it.
# See config/experiment.yaml under `particle_selection` for the measurements behind it. Results
# produced before 2026-08-11 used the other definition and are not comparable.

seed_everything: 42

data:
  # The dataset on ce-ai-1: 100 shards of 1,000 events each, 100,000 events from 100 GB.
  train_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu0/
  val_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu0/
  test_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu0/

  event_type: ttbar
  dataset_prefix: ttbar_pu0
  calo_only: true

  # 1. Was raised to 4 for DIAS on 2026-08-13 and PUT BACK THE SAME DAY, because the DIAS run it was
  # raised for never produced a single optimiser step. Do not raise it again without reading this.
  #
  # STEPS = num_train x max_epochs / batch_size, so batch 4 divides the step count by four. This
  # model is step-starved -- validation loss was still falling at the end of every run so far, and
  # two earlier runs reached nearly the same loss at ~20,000 steps despite 6.7x different data
  # volumes -- so dividing the steps is the wrong direction unless something pays for it.
  #
  # NOTHING PAID FOR IT. Two separate reasons, both measured rather than argued:
  #
  #   1. batch_size == 1 IS A DIFFERENT CODE PATH IN data.py. get_dataloader() hands PyTorch
  #      batch_size=None with NO collate_fn, because dataset items already carry a leading batch
  #      dim. Any batch > 1 instead routes through collate_calohit_batch, which pads the
  #      variable-length hit dimension to the largest event in the batch. pu0 events run ~22k cells
  #      mean against a 62k max, so that padding is both a big allocation and real CPU work, and it
  #      happens INSIDE the dataloader workers -- the exact place this job was already limited.
  #   2. The job was measured input-bound anyway (30% GPU utilisation at 32 CPUs / 24 workers, 16%
  #      at 12 CPUs). When the dataloader is the ceiling, a bigger batch does not raise events/s.
  #
  # MEMORY is not the constraint either way and never was the reason: batch 1 peaks at 12.5 GB
  # against batch 4's ~34 GB, on an 80 GB card (confirmed on the DIAS node 2026-08-13; the cluster
  # docs saying 40 GB are out of date). The card was never what limited this.
  #
  # COUPLED TO lrs_config.max BELOW, which goes back to 1e-4 with this. They were set together.
  batch_size: 1
  input_sort_field: phi
  # 24. row_group_cache_size stays at data.py's default of 8: a pu0 shard is ~790 MB on disk against
  # pu200's ~2.9 GB.
  #
  # THE "104 CORES SO THEY ARE NOT COMPETING" REASONING WAS ce-ai-1's AND DOES NOT TRANSFER. On DIAS
  # the job gets a 32-CPU affinity mask out of the node's 128, and the libraries inside each worker
  # size their own thread pools from the MACHINE, not the mask -- 48 worker processes were measured
  # holding 960 threads on those 32 cores. dias/env.sh pins the thread pools to 1 to stop that; if
  # this number is ever raised, re-check the thread total, not just the process count.
  num_workers: 24

  num_train: 20000
  num_val: 250
  num_test: 500
  train_start_event: 0
  val_start_event: 20000
  test_start_event: 20250

  # Zero-suppression. 1e-3 removed ~84% of hits and shredded clusters (median hits/particle
  # 15 -> 4); 2e-4 keeps them intact at ~22k hits/event.
  calohit_min_energy: 2.0e-4

  particle_min_pt: 0.5
  # PU200 DIFFERS: barrel-only there, 0.88.
  particle_max_abs_eta: 4.0
  particle_hit_cuts: {}
  particle_include_charged: true
  particle_include_neutral: true

  # 10, was 3. Particles depositing only a handful of cells are not reconstructable but still sat
  # in the efficiency denominator. Measured at 60 events under shower-level truth, raising the
  # floor from 3 to 10 drops 7% of targets (183.3 -> 170.3 per event) and costs almost nothing in
  # coverage: the fraction of cells owned by some target goes 0.819 -> 0.816, because the targets
  # it removes are by construction the ones holding the fewest cells. Median cells per target
  # rises 58 -> 64.
  #
  # THIS IS PART OF THE TRUTH DEFINITION, not a display cut. It is in event_store.py's
  # CONTRACT_KEYS and must match `particle_selection.particle_min_num_calohits` in
  # config/experiment.yaml, or the store will refuse to open.
  particle_min_num_calohits: 10

  # THE TRUTH DEFINITION. Merges Geant secondaries produced inside the calorimeter back onto the
  # particle that entered it, so one shower is one target. Measured over 2,800 pu0 events, the
  # per-particle alternative made 85.7% of targets non-primary secondaries, 71.8% of them born
  # inside the calorimeter, and left only 31.7% of calorimeter energy owned by any target (0.864
  # here). The front face below is measured from the calo-hit cloud, not assumed: ECAL barrel
  # spans r 1252-1519 mm, ECAL endcap starts at |z| 3202 mm.
  particle_collapse_shower_secondaries: true
  calo_entry_radius: 1252.0
  calo_entry_abs_z: 3202.0

  # 400. SIZED FROM A MEASUREMENT over 2,800 events: targets/event mean 186, p99 361, p99.9 434,
  # max 488. A cap of 350 truncates 1.36% of events, 400 truncates 0.32%, 500 truncates none. 400
  # is the knee, and truncation is SILENT (data.py slices the overflow away), so the event store's
  # `truncated` column is what to check it against afterwards. The realised rate was 1 in 500.
  #
  # MUST EQUAL model...decoder.num_queries below.
  # PU200 DIFFERS: 1600 there.
  event_max_num_particles: &num_objects 400

  return_calohits: true
  return_tracks: false

trainer:
  # 6, giving 20,000 x 6 / 1 = 120,000 optimiser steps -- the same step count the ce-ai-1 run had.
  # This number and batch_size are coupled and must be read together:
  #
  #   steps = num_train x max_epochs / batch_size
  #
  #   batch 1, 6 epochs   = 120,000 steps   <- this, and the ce-ai-1 run
  #   batch 4, 6 epochs   =  30,000 steps   <- what raising the batch alone cost
  #   batch 4, 12 epochs  =  60,000 steps   <- the compromise this file briefly carried
  #   batch 4, 24 epochs  = 120,000 steps   <- ~69 h at the old DIAS rate, over the 2-day cap
  #
  # Going back to batch 1 is what makes 120,000 steps reachable here at all: at batch 4 they were
  # outside the partition's walltime cap, which is why max_epochs had to be cut to 12 for 60,000.
  #
  # WALLTIME, from a rate MEASURED at this configuration by job 48411 on 2026-08-13: 4.24 steps/s,
  # so 120,000 steps is ~7.9 h of training plus ~0.3 h of validation, 8-9 h all in. dias/train.sh
  # asks for 24 h, deliberately generous -- that probe ran 600 events, small enough to sit in the
  # workers' caches, and 20,000 will read from disk considerably more.
  #
  # The superseded 1.94 events/s (2026-08-05) was taken BEFORE dias/env.sh pinned the native thread
  # pools, when 48 workers were contending with 960 threads over a 32-CPU mask. Do not compare
  # against it. Re-measure with
  #
  #   NUM_TRAIN=600 MAX_EPOCHS=1 sbatch src/maskformer/dias/train.sh
  #
  # after any change to workers, CPUs or batch size, and size BOTH this and SBATCH --time from it.
  #
  # OneCycleLR is sized from total steps and cannot be resized mid-run, so a schedule that overruns
  # its walltime never reaches its decay phase and its final checkpoint sits at a high learning
  # rate. Undershooting the wall costs nothing; overshooting costs the run.
  max_epochs: 6
  # 1, was 4. The accumulation existed to serve Lion, which uses only the SIGN of the gradient and
  # is therefore too noisy at batch 1; AdamW below normalises by a running second moment instead and
  # does not need the same smoothing. Taking a step per event gives 4x the optimiser steps for the
  # same walltime, which is the point.
  #
  # THIS IS COUPLED TO lrs_config.max. That value was sqrt(4)-scaled to compensate for accumulating;
  # with accumulation off, the scaling is no longer what justifies it -- see the note there. Do not
  # change one of these without rereading the other.
  accumulate_grad_batches: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 10
  default_root_dir: logs
  # 1.0, was 0.1. THIS HAD TO MOVE WITH THE OPTIMISER and is the likeliest thing to have silently
  # ruined the run if left alone. Lion's update is the sign of the gradient, so its raw gradient
  # norms sat in a range where 0.1 was a sane ceiling. AdamW does not bound its update that way and
  # its gradient norms here are expected to be O(1), so a 0.1 clip would rescale essentially EVERY
  # step -- which silently replaces the OneCycle schedule with "constant tiny step", and shows up as
  # a loss curve that flattens early for no visible reason rather than as an error.
  #
  # hepattn logs no gradient norm anywhere, so this cannot be confirmed from the run as configured.
  # If the loss does flatten early, that is the first thing to instrument.
  gradient_clip_val: 1.0
  enable_progress_bar: true
  val_check_interval: 0.25

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      workspace: finnbarwilson
      project: colliderml-calo-clustering
      online: true

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        log_model: false
        every_n_epochs: 1
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  # AdamW, was Lion. Lion's sign-only update is what forced accumulate_grad_batches: 4 above; AdamW
  # is better behaved at batch 1, which is the whole reason the accumulation could be dropped.
  optimizer: adamw

  lrs_config:
    initial: 1e-5
    # 1e-4. Reached here by two different routes that happen to agree: it was previously the
    # sqrt(4) scaling of 5e-5 for accumulate_grad_batches: 4, and it is also the recommended AdamW
    # starting point for this setup. The earlier finding that "1e-4 thrashed and 1.5e-4 diverged at
    # batch 1" was measured under LION at batch 1 and does NOT transfer to AdamW.
    # If 1e-4 turns out to underfit, 5e-4 is the next value to try.
    # 1e-4 AT BATCH 1. This was briefly 2e-4, the sqrt(4) scaling for batch 4; batch_size went back
    # to 1 on 2026-08-13 (see the note there) and this went back with it, as that note required.
    max: 1e-4
    end: 1e-6
    # Unchanged at 0.01, but it now means something different and the new meaning is better.
    # OneCycleLR is sized from TOTAL optimiser steps, and dropping accumulation multiplied those by
    # 4. At the 7 epochs set above that is 20k events x 7 = 140,000 steps, against ~20,000 under the
    # old accumulate-4 / 4-epoch arrangement -- so warmup is ~1,400 steps where it was ~200. Warmup
    # should scale with the run, which is why this stays a FRACTION rather than becoming an absolute
    # count: re-sizing max_epochs then re-sizes the warmup for free.
    pct_start: 0.01
    skip_scheduler: false
    # Left at 1e-5 ON PURPOSE, despite AdamW's usual 1e-2. Lion convention is a weight decay several
    # times LARGER than AdamW's for the same regularisation, so 1e-5 under Lion was already almost
    # no decay, and the matching AdamW value is smaller still. Raising it to a conventional AdamW
    # default here would be a real change in regularisation landing in the same run as the optimiser
    # swap, the objective change and the head removal -- one confound too many. Change it on its own
    # later if the model overfits, which at 4 epochs over 20k events it currently does not.
    weight_decay: 1e-5

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256
      # The encoder sorts constituents by this before windowed attention, so it decides which hits
      # share a window.
      input_sort_field: phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: calohit
                input_dtype: float32
                # log_energy, not total_energy: InputNet applies no normalisation, and raw
                # total_energy is ~1000x smaller than the O(1) coordinates, so the single most
                # important feature for calo clustering was numerically drowned out.
                fields:
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                  - log_energy
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 7
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                # FourierPositionEncoder, not PositionEncoder: the latter's default frequencies
                # alias at the scale that matters here (a shower spans ~0.007 in eta), giving hits
                # of the same particle decorrelated encodings. Measured 2.3x more locality signal.
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: calohit
                    dim: *dim
                    fields:
                      - r
                      - eta
                      - phi

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 4
          dim: *dim
          attn_type: flash-varlen
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      decoder:
        num_decoder_layers: 4
        num_queries: *num_objects
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 0.1
                costs:
                  # 0.1, WAS 0, AND THE 0 WAS A MISTAKE RATHER THAN A CHOICE. It entered in
                  # 16be6f2 alongside a correct change to the MASK task's costs -- the instruction
                  # was "turn the bce COST off", meaning mask_bce in the mask task, and it was
                  # applied to this task's object_bce as well. They are different BCEs.
                  #
                  # WHAT THE 0 DID. `costs` is what the Hungarian matcher uses to pair queries with
                  # truth particles; it is detached, so it changes the PAIRING and never the
                  # gradient. At 0 this head contributed nothing to that pairing, so queries were
                  # matched on mask overlap alone -- a query this head confidently called fake
                  # could still be handed a real particle and was then trained to call itself real.
                  # The head that decides HOW MANY objects exist was excluded from deciding WHICH.
                  #
                  # Measured on the 2026-08-11 run, that is exactly where the model failed: across
                  # the whole mask-threshold range f1 moved 0.546-0.548 (the masks are near-bimodal
                  # and essentially solved), while the object threshold alone moved it 0.512->0.548
                  # and the cluster count 310->160 against 185 true targets.
                  #
                  # 0.1 matches the original ColliderML config and hepattn's own CLD experiment,
                  # which uses object_bce as its DOMINANT matching cost.
                  object_bce: 0.1
                dim: *dim
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                # A true particle only counts as reconstructed if its matched query is also accepted
                # here, and the default is an argmax at 0.5. Affects prediction and metrics only,
                # never the loss, so it is safe to leave wrong during training and fix afterwards.
                #
                # 0.5, re-scanned 2026-08-12 on the tuning window under shower-level truth. 0.2
                # came from a sweep against the old objective and the old truth; on this target it
                # over-accepted, giving 310 clusters per event against 185 true particles. Affects
                # prediction and metrics only, never the loss.
                eval_threshold: 0.5

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                # SIMPLIFIED BASELINE. Was dice 5.0 + focal 20.0 in both losses and costs. The
                # point of this configuration is to find out what the plain objective does before
                # any of the weighting is re-added: equal-weighted DICE and BCE, no focal term.
                losses:
                  mask_dice: 1.0
                  mask_bce: 1.0
                # DICE only, which is both what was asked for ("bce cost off") and what hepattn's
                # CLD experiment does -- it comments its own mask_bce cost out and keeps mask_dice.
                # Matching decides WHICH query owns a target, and one term deciding that is easier
                # to reason about when the result moves.
                #
                # An earlier comment here claimed loss.py has no `mask_bce` in cost_fns and that
                # BCE therefore could not be a cost. That is false (loss.py:392). This is a choice.
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: *dim

            # THE INCIDENCE HEAD IS DELIBERATELY ABSENT HERE, and this is the ablation half of the
            # simplified baseline above: one object-classification head and one mask head, nothing
            # else. It predicted I_ia = E_ia/E_i, the fraction of each cell's energy belonging to
            # each particle, supervised with kl_div at weight 100 against the target built in
            # data.py from contrib_particle_ids/contrib_energies.
            #
            # It is worth knowing what removing it does and does not do:
            #   - It does NOT change the clustering path. The head was never in the matching cost
            #     (kl_div_cost is a [queries x particles x hits] tensor, ~86 GB here) and nothing
            #     downstream consumed its output, so cluster membership came from the mask head
            #     either way. What is lost is the auxiliary gradient it put on the shared trunk.
            #   - It DOES remove the only representation of a shared cell in the model. ~12.6% of
            #     cells have more than one contributing particle and the binary mask target cannot
            #     express that. eval/dump.py then writes width-0 mf_incidence arrays and sets
            #     maskformer.has_incidence false, so the store stays readable and the soft study
            #     simply has no MaskFormer side; truth_incidence is unaffected.
            #   - It frees the dense [n_particles x n_hits] float32 target, ~88 MB/event at pu0.
            #
            # To restore it, take the block from git:
            #   git show ee21566:src/maskformer/hepattn_colliderml/configs/calo_clustering.yaml
