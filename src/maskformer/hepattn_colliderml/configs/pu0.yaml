# ColliderML calorimeter clustering: pileup 0, full detector.
#
#   cd <hepattn checkout>/src/hepattn/experiments/colliderml
#   python main.py fit --config configs/pu0.yaml
#
# Self-contained: there are exactly two configs in this directory, one per pileup condition, and
# neither is an overlay on the other. `tasks` is a YAML list, so an overlay touching it would
# replace the whole list rather than merge into it, and the objective a run used would depend on
# the order of the --config flags.
#
# The two files are identical except where the data forces a difference, and those places are
# marked "PU200 DIFFERS" / "PU0 DIFFERS"; `diff configs/pu0.yaml configs/pu200.yaml` is the
# intended way to see what pileup changes. Keep them in sync by hand.
#
# The truth definition is shower-level: `particle_collapse_shower_secondaries: true` makes one
# target per particle ENTERING the calorimeter rather than per Geant particle depositing in it.
# See config/experiment.yaml under `particle_selection`.

# The Comet experiment name and the log directory name; hepattn's CLI links both to it, and
# without this key every run is logged as "hepattn". PU200 DIFFERS.
name: ColliderML_pu0

seed_everything: 42

data:
  # Overridden by the launchers from DATA_DIR; setup/download_data.py puts the shards here.
  train_dir: external/ColliderML_data/ttbar_pu0/
  val_dir: external/ColliderML_data/ttbar_pu0/
  test_dir: external/ColliderML_data/ttbar_pu0/

  event_type: ttbar
  dataset_prefix: ttbar_pu0
  calo_only: true

  # batch_size 1 is a different code path in data.py: the dataloader is handed batch_size=None
  # with no collate_fn, since items already carry a leading batch dim. Anything larger pads the
  # variable-length hit dimension to the largest event in the batch, inside the workers, which is
  # where this job is already limited, and it divides the step count, which this model needs.
  batch_size: 1
  input_sort_field: phi
  num_workers: 24

  # PU200 DIFFERS: 6000 there, all that fits before the window runs into the CLUE stores.
  num_train: 20000
  num_val: 250
  num_test: 500
  train_start_event: 0
  val_start_event: 20000
  test_start_event: 20250

  calohit_min_energy: 2.0e-4

  particle_min_pt: 0.5
  # PU200 DIFFERS: barrel-only there, 0.88, on both cells and particles.
  particle_max_abs_eta: 4.0
  particle_hit_cuts: {}
  particle_include_charged: true
  particle_include_neutral: true

  particle_min_num_calohits: 10

  particle_collapse_shower_secondaries: true
  calo_entry_radius: 1252.0
  calo_entry_abs_z: 3202.0

  # Query budget, aliased into the decoder below. PU200 DIFFERS: 1600 there.
  event_max_num_particles: &num_objects 400

  return_calohits: true
  return_tracks: false

trainer:
  # PU200 DIFFERS: 4 there. OneCycleLR is sized from total steps, so this must be set from a
  # measured throughput; a wrong estimate leaves the final checkpoint at a high learning rate.
  max_epochs: 6
  accumulate_grad_batches: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 10
  default_root_dir: logs
  gradient_clip_val: 1.0
  enable_progress_bar: true
  val_check_interval: 0.25

  # Comet logging. Change `workspace` to your own, or set `online: false` to disable it.
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      workspace: finnbarwilson
      project: colliderml-calo-clustering
      online: true

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        log_model: false
        every_n_epochs: 1
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  optimizer: adamw

  lrs_config:
    initial: 1e-5
    max: 1e-4
    end: 1e-6
    pct_start: 0.01
    skip_scheduler: false
    weight_decay: 1e-5

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256
      input_sort_field: phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: calohit
                input_dtype: float32
                fields:
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                  - log_energy
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 7
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: calohit
                    dim: *dim
                    fields:
                      - r
                      - eta
                      - phi

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 4
          dim: *dim
          attn_type: flash-varlen
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      decoder:
        num_decoder_layers: 4
        num_queries: *num_objects
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 0.1
                costs:
                  object_bce: 0.1
                dim: *dim
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                eval_threshold: 0.5

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 1.0
                  mask_bce: 1.0
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: *dim
