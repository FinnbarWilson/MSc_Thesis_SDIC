# ColliderML calorimeter clustering: pileup 200, barrel only (|eta| <= 0.88).
#
#   cd <hepattn checkout>/src/hepattn/experiments/colliderml
#   python main.py fit --config configs/pu200.yaml
#
# Self-contained, and not an overlay on pu0.yaml: see that file's header for why. The two are
# identical except where the data forces a difference, marked "PU0 DIFFERS" / "PU200 DIFFERS".
#
# The barrel cut is what makes this fit on one card. MaskFormer's memory is driven by
# num_queries x num_hits, and a faithful pileup-200 event is about 200x the pileup-0 footprint --
# two orders of magnitude past an 80 GB A100 rather than a tuning problem. Cells and particles
# are cut together, since cutting either alone would leave targets with no cells or cells with
# no target. Every pileup-200 number in this work describes this cut only.
#
# The truth definition is shower-level, the same as pu0, which is what makes the two columns
# comparable at all.

# The Comet experiment name and the log directory name; hepattn's CLI links both to it, and
# without this key every run is logged as "hepattn". PU0 DIFFERS.
name: ColliderML_pu200

seed_everything: 42

data:
  # Overridden by the launchers from DATA_DIR; setup/download_data.py puts the shards here.
  train_dir: external/ColliderML_data/ttbar_pu200/
  val_dir: external/ColliderML_data/ttbar_pu200/
  test_dir: external/ColliderML_data/ttbar_pu200/

  event_type: ttbar
  dataset_prefix: ttbar_pu200
  calo_only: true

  # batch_size 1 is a different code path in data.py: the dataloader is handed batch_size=None
  # with no collate_fn, since items already carry a leading batch dim. Anything larger pads the
  # variable-length hit dimension to the largest event in the batch, inside the workers.
  batch_size: 1
  input_sort_field: phi
  num_workers: 24
  # PU0 DIFFERS: absent there. A pileup-200 row group is large enough that re-reading it per
  # event dominates the loader.
  row_group_cache_size: 3

  # PU0 DIFFERS: 20000 there. All that fits before the window runs into the CLUE store windows,
  # so this run is step-limited by the event budget rather than by choice.
  num_train: 6000
  num_val: 250
  num_test: 500
  train_start_event: 0
  val_start_event: 6000
  test_start_event: 6250

  calohit_min_energy: 2.0e-4

  particle_min_pt: 0.5
  # Cut with the cells above, not independently. PU0 DIFFERS: 4.0 there.
  particle_max_abs_eta: 0.88
  # The barrel cut. PU0 DIFFERS: absent there, the full detector being used.
  calohit_max_abs_eta: 0.88
  particle_hit_cuts: {}
  particle_include_charged: true
  particle_include_neutral: true

  particle_min_num_calohits: 10

  particle_collapse_shower_secondaries: true
  calo_entry_radius: 1252.0
  calo_entry_abs_z: 3202.0

  # Query budget, aliased into the decoder below. PU0 DIFFERS: 400 there.
  event_max_num_particles: &num_objects 1600

  return_calohits: true
  return_tracks: false

trainer:
  # PU0 DIFFERS: 6 there. OneCycleLR is sized from total steps, so this must be set from a
  # measured throughput; a wrong estimate leaves the final checkpoint at a high learning rate.
  max_epochs: 4
  accumulate_grad_batches: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 10
  default_root_dir: logs
  gradient_clip_val: 1.0
  enable_progress_bar: true
  val_check_interval: 0.25

  # Comet logging. Change `workspace` to your own, or set `online: false` to disable it.
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      workspace: finnbarwilson
      project: colliderml-calo-clustering-pu200
      online: true

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        log_model: false
        every_n_epochs: 1
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  optimizer: adamw

  lrs_config:
    initial: 1e-5
    max: 1e-4
    end: 1e-6
    pct_start: 0.01
    skip_scheduler: false
    weight_decay: 1e-5

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256
      input_sort_field: phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: calohit
                input_dtype: float32
                fields:
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                  - log_energy
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 7
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: calohit
                    dim: *dim
                    fields:
                      - r
                      - eta
                      - phi

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 4
          dim: *dim
          attn_type: flash-varlen
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      decoder:
        num_decoder_layers: 4
        num_queries: *num_objects
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 0.1
                costs:
                  object_bce: 0.1
                dim: *dim
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                eval_threshold: 0.5

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 1.0
                  mask_bce: 1.0
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: *dim
