# PROBE ARM 1: turn off masked attention in the decoder.
#
#   main.py fit --config configs/calo_clustering.yaml --config configs/overlay_probe_maskattn.yaml
#   OVERLAY=overlay_probe_maskattn.yaml sbatch src/maskformer/dias/probe_arm.sh
#
# THE HYPOTHESIS THIS TESTS, and the measurement behind it (2026-08-06, run 48247 scored over
# events [20250, 20750)):
#
#   particle E    true cells    cells in the matched cluster
#   < 2 GeV             13.5    6.4
#   2-5                 19.5    6.5
#   5-10                24.5    6.5
#   10-20               28.8    5.9
#   > 20 GeV            38.2    5.5
#
# The mask head recovers ~6 cells whatever it is looking at, and slightly FEWER as the shower gets
# bigger. A >20 GeV shower is therefore chopped across ~4.9 clusters, the matcher keeps one, and it
# holds a fifth of the energy -- which is why MaskFormer scores 0.150 at E > 20 against CLUE's
# 0.224 while beating it comfortably below 2 GeV.
#
# `mask_attention: true` restricts each query's cross-attention to the cells its own previous-layer
# mask already claims. A query that starts small can only look where it already is, so it cannot
# discover the rest of a large shower: a self-reinforcing small mask, and the standard Mask2Former
# masked-attention pathology. It predicts exactly the saturating cluster size measured above.
#
# WHAT WOULD COUNT AS A RESULT. Not the headline efficiency -- at one epoch it is far too
# insensitive. The signal is the SHAPE of the column above: it should stop being flat and start
# rising with particle energy. dias/compare_probes.py reports it against the baseline.
#
# THE COST, IF IT WORKS. Masked attention exists to speed convergence by focusing each query.
# Removing it may well train more slowly, so a one-epoch arm that looks flat on loss but right on
# shape is a REASON TO RUN IT LONGER, not a failure.

trainer:
  # One epoch, ~2.9 h. The pathology is fully formed after one epoch and barely moves afterwards --
  # measured on the checkpoints of run 48247, where cells recovered at E > 20 went 3.9 (epoch 0) ->
  # 4.7 (epoch 1) -> 5.5 (epoch 6) against a true 38, and eff@0.5 went 0.122 -> 0.134 -> 0.136.
  # Five extra epochs bought +0.002, so a long arm would buy nothing this probe cannot see.
  max_epochs: 1

  logger:
    init_args:
      # Kept out of the project the reported runs live in: these are one-epoch probes, not results.
      project: colliderml-calo-probes

model:
  model:
    init_args:
      # Restated in full rather than overriding the one key. YAML anchors do not cross files, and a
      # partial mapping risks jsonargparse replacing the block rather than merging into it, which
      # would silently drop num_decoder_layers and decoder_layer_config back to their defaults --
      # the same trap overlay_pu200.yaml documents. KEEP IN SYNC WITH calo_clustering.yaml; the
      # only intended difference is mask_attention.
      decoder:
        num_decoder_layers: 4
        num_queries: 1000          # must equal data.event_max_num_particles in the base config
        mask_attention: false      # <-- THE ONLY CHANGE
        use_query_masks: false
        decoder_layer_config:
          dim: 256                 # anchors do not cross files; this is *dim from calo_clustering.yaml
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}
