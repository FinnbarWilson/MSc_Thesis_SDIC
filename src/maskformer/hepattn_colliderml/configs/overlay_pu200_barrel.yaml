# Pileup-200, barrel only. Applied on top of calo_clustering.yaml:
#
#   main.py fit --config configs/calo_clustering.yaml --config configs/overlay_pu200_barrel.yaml
#
# Rationale and measurements: ../../ce_ai_1/PU200_STATUS.md
#
# INHERITED FROM calo_clustering.yaml, NOT RESTATED HERE. This overlay does not touch `tasks`,
# `optimizer` or `accumulate_grad_batches`, so it picks up the simplified baseline that file now
# defines: AdamW at max lr 1e-4, accumulate_grad_batches 1, no incidence head, and a mask head with
# mask_dice = mask_bce = 1.0 in the loss and mask_dice = 1.0 alone in the cost. That is deliberate --
# the pu0 and pu200 runs are meant to differ only in the data, so the objective is defined in one
# place. Contrast overlay_metric_aligned.yaml, which restates the whole task list and therefore
# reintroduces the incidence head and the focal term if applied.
#
# The eta cut below is the "new cut at pu200" half of that plan: pu0 keeps the full event
# (calo_clustering.yaml stays at calohit_min_energy 2e-4 with no eta restriction), and the
# containment argument for restricting the sample is made here, at pu200, where it is needed.

data:
  train_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu200/
  val_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu200/
  test_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu200/
  dataset_prefix: ttbar_pu200

  # Barrel-only, and the one physics change from pu0. The HCAL barrel reaches r=3441 at |z|<=3450,
  # so a track steeper than eta=0.883 leaves through the barrel end and puts the rest of its shower
  # in the endcap; cutting here keeps every target fully contained. Applied to cells and particles:
  # cutting cells alone would leave targets whose cells have been removed.
  calohit_max_abs_eta: 0.88
  particle_max_abs_eta: 0.88

  calohit_min_energy: 2.0e-4
  particle_min_pt: 0.5

  # Must equal num_queries below. Measured 1,342 targets/event mean, 1,750 max.
  event_max_num_particles: 2100

  # 24, was 8. pu200 is CPU-bound, not GPU-bound: measured on the 8-worker run, the card drew 76 W
  # of a 300 W TDP while the process tree used ~1250% CPU, and the box has 104 cores at a load
  # average of ~15. This is the same diagnosis and the same fix as the pu0 run on DIAS.
  #
  # ONLY SAFE BECAUSE row_group_cache_size DROPS TO 3 just below; at data.py's default of 8 this
  # would have put host RSS near 690 GB. The two numbers must move together.
  #
  # It does NOT fix all of the CPU cost. The Hungarian matcher is ~300 ms per solve at 2100 queries
  # and runs once per decoder layer, so ~1.2 s of every step is single-threaded work in the main
  # process that no number of workers touches. LAP is O(n^3), so that cost is ~9x the pu0 figure.
  num_workers: 24

  # 3, against data.py's default of 8, and PU200-ONLY on purpose: it is set here rather than in
  # data.py so that changing it cannot alter pu0, which shares that file. A decoded pu200 shard is
  # 4.0 GB, so the 24 workers above would need ~690 GB at 8 slots; at 3 they measured 518 GB
  # resident, against 847 GB free on this box.
  #
  # NOTE the 518 GB is higher than the ~260 GB first estimated, because the run spawns ~49 worker
  # processes (train plus validation and prefetch), not the 24 requested. Budget from the process
  # count, not the num_workers value.
  row_group_cache_size: 3

  num_train: 6000
  num_val: 250
  num_test: 500
  train_start_event: 0
  val_start_event: 6000
  test_start_event: 6250

trainer:
  # 3, was 7. SEVEN WAS AN UNSIZED PLACEHOLDER inherited from overlay_pu200.yaml, whose schedule was
  # measured for a DIFFERENT configuration (500 queries at calohit_min_energy 1e-3). PU200_STATUS.md
  # §8 flags it as "still a placeholder"; this is that number being set.
  #
  # Sized from external/benchmark_barrel.log: 0.36 events/s over 200 events. De-rated by 41%, not
  # the 25% that log assumes -- PU200_STATUS.md §6 measured the real pu200 penalty at -41% (0.98 ->
  # 0.58) because a decoded pu200 shard is 4.0 GB and data.py's 8-row-group cache holds far less of
  # the working set than in a 2-shard benchmark. The barrel eta cut shrinks the event AFTER decode,
  # so it does not reduce that penalty.
  #
  #   0.36 x 0.59 = 0.21 ev/s  ->  6000/0.21 = 7.9 h + ~7 min validation  ->  ~8.0 h/epoch
  #
  # THAT ESTIMATE WAS WRONG AND 3 WAS ALSO TOO MANY. Measured on the real run (2026-08-05, 230
  # steps in 25m00s): 0.153 it/s, and DECLINING -- 0.18 at step 10, 0.17 at step 60, 0.15 at step
  # 230. The benchmark climbed over the same range (0.14 -> 0.36) because its 2-shard working set
  # fitted the cache; the real run walks into fresh shards and never does. So the penalty here is
  # -58%, not the -41% measured for the non-barrel config, and it arrives as a downward drift
  # rather than a fixed discount.
  #
  #   0.153 it/s -> 10.87 h train + 0.72 h validation (4 x 250 events) = 11.6 h/epoch
  #   2 epochs = 23.2 h   (fits the 28 h wall with margin for further decay)
  #   3 epochs = 34.8 h   (would truncate OneCycle mid-epoch-3)
  #
  # TWO IS NOT A WEAKER SCHEDULE THAN THE OLD ONE. accumulate_grad_batches is now 1, so 2 epochs
  # over 6000 events is 12,000 optimiser steps, against the 10,500 the previous 7-epoch/accum-4
  # plan would have taken. Fewer passes, more steps.
  #
  # THE LESSON, AGAIN: PU200_STATUS.md §6 says treat any short-benchmark rate as an upper bound.
  # De-rating it by a penalty measured on a DIFFERENT config was still too optimistic. Size from a
  # few hundred steps of the real run before committing, which is what this number now is.
  #
  # 5, RAISED FROM 2, AND THE 2 WAS TOO CONSERVATIVE. The rate above was measured at step 200, when
  # the run had not reached steady state: the completed 2-epoch run then did 0.43 it/s (epoch 1 in
  # 3:51:50, both epochs in 8h40m), nearly 3x the estimate, so the 28 h guard had room for ~5 epochs
  # all along and was given 2.
  #
  # THE REASON TO SPEND THEM IS MEASURED, not a hope that longer is better. Between 4,000 and 12,000
  # steps on this exact objective the mask head went from 1.7x to 1.3x oversized, purity 0.202 ->
  # 0.319 and F1 0.312 -> 0.423 -- and val_loss was still falling at the final checkpoint. That gain
  # is the LOGIT RANKING improving, which matters because it is the only thing that can improve:
  # scripts/sweep_pred_threshold.py on the 2-epoch checkpoint found F1 flat at 0.338-0.359 across
  # the whole mask x object threshold grid, and reported "the MASKS are the bottleneck" with the
  # object head already accepting 0.929 of true particles. A flat plateau means no cut point can
  # help and the cells are simply ordered wrongly; training is the lever that reorders them.
  #
  #   5 epochs at ~4.2 h each (epoch 0 is slower while caches warm) ~= 21 h against the 28 h guard.
  #
  # If this is resized again, re-read the OneCycle warning above: the schedule is sized from total
  # steps and a truncated run ends at a high learning rate.
  max_epochs: 5

  # 28 h, raised from 23:30 to cover the pessimistic end of the range above. This machine has no
  # queue and no scheduler walltime (ce_ai_1/env.sh: "no walltime cap here"), so this is purely a
  # runaway guard and costs nothing to widen. It should NOT trigger; if it does, the throughput
  # estimate is wrong and that is a sizing bug to fix rather than a normal ending.
  max_time: "01:04:00:00"

  logger:
    init_args:
      project: colliderml-calo-clustering-pu200

model:
  model:
    init_args:
      # THE MASK OBJECTIVE IS SET HERE, NOT IN calo_clustering.yaml, AND ON PURPOSE. pu0 runs
      # dice 1 + bce 1 and is a different regime -- its target is ~2.3x denser (positive rate
      # ~4.1e-04 against 1.81e-04 here) -- so the two pileup conditions do not have to share an
      # objective and this one is chosen for pu200 alone.
      #
      # CHOSEN FROM A MEASURED SWEEP, not from the pu0 weights. Three arms, 1500 steps each on this
      # exact config, scored by eff/purity on 10 test events with best-overlap matching
      # (external/sweep_mask_loss_results.txt, and configs/overlay_sweep_short.yaml for the setup):
      #
      #   arm                   max prob   eff@0.5   eff@0.75   pur@0.5   cells/flow (truth 15)
      #   dice 20 + focal 1      1.0000     0.6641    0.4192     0.1175        31.7   <- this
      #   dice  5 + focal 20     1.0000     0.6645    0.4109     0.1179        32.8
      #   dice only              0.0000     collapsed -- no cell anywhere above 0.5
      #   dice 1 + bce 1         0.0995     collapsed -- mean output == the target prior
      #
      # WHAT THE SWEEP ACTUALLY ESTABLISHED. Focal's PRESENCE is what matters, not its weight: both
      # arms that had it work and are statistically indistinguishable, and both arms without it
      # collapse. The two collapses have different mechanisms and both are dead ends -- BCE
      # converges to predicting the target prior everywhere, while dice alone saturates the sigmoid
      # at zero and sits on a flat region where the gradient vanishes. Focal is the per-cell term
      # that keeps the sigmoid off the floor; dice is the set-overlap term that is immune to the
      # 5,400:1 class imbalance. Neither does the other's job.
      #
      # WHY THE DICE-DOMINANT ARM WON A TIE. The remaining failure is over-prediction (masks 2.1x
      # truth, purity 0.12), dice is the term that governs predicted SET SIZE, and this arm is
      # marginally tighter and marginally better at the stricter working point. The margin is
      # within noise on 10 events; the mechanism is the actual reason.
      #
      # AN EARLIER COLLAPSE HAD A DIFFERENT CAUSE ENTIRELY. The 7-epoch run of 20260804-T133952
      # collapsed with dice 5 + focal 20, which the arms above show trains fine here -- that one was
      # the non-barrel config, whose 1e-3 energy cut left a positive rate of 4.67e-05. Do not read
      # it as evidence about loss weights.
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 0
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                # STALE, and it is the first thing to re-sweep once this run finishes. 0.2 came from
                # a sweep against a different objective; here it accepts 1,749 of 2,100 queries
                # against 1,498 true particles, which is most of why purity is 0.12. It affects
                # prediction and metrics only, never the loss, so it is safe to leave and fix after
                # the fact: scripts/sweep_pred_threshold.py.
                eval_threshold: 0.2

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 20.0
                  mask_focal: 1.0
                # Dice-only, unchanged from calo_clustering.yaml. Note loss.py has no `mask_bce`
                # entry in cost_fns at all, so BCE could not be a cost here even if wanted.
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: 256

      decoder:
        num_decoder_layers: 4
        num_queries: 2100
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: 256
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}
