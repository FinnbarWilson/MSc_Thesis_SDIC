# PROBE ARM 5: add an auxiliary cell-pair affinity head, and change nothing else.
#
#   OVERLAY=overlay_probe_affinity.yaml sbatch src/maskformer/dias/probe_arm.sh
#
# THE ARGUMENT, from three independent negatives rather than an analogy.
#
#   1. A learned per-cell attribution model over the store rediscovered proximity: its dominant
#      feature was distance-to-nearest-cell by 3x, and stacking it on geometric chaining produced
#      bit-identical results.
#   2. The post-encoder cell embeddings separate same-particle pairs at AUC 0.683 against plain 3D
#      distance's 0.661 (dias/probe_encoder_affinity.py, 400k local pairs). +0.022.
#   3. Splitting clusters at local energy maxima made both efficiency and purity worse, so the
#      over-merging is not resolvable from the energy topology either.
#
# Every signal available after training reduces to proximity, because nothing in the objective ever
# asked for a relation between cells. This asks. The head projects post-encoder embeddings into a
# small space and trains cosine similarity of NEARBY cell pairs to predict shared truth ownership.
#
# WHAT IT DOES NOT TOUCH: the mask head, the classification head, the matcher, the decoder, the
# optimiser and the data. It runs in `encoder_tasks`, which hepattn provides for post-encoder tasks
# whose losses need no matching, so this is an ADDITION to the architecture. That matters for the
# study's question -- whether a MaskFormer-style model can do calorimeter clustering -- which a
# different architecture would not answer.
#
# NO PATCH TO hepattn IS NEEDED. The task lives in this repository, at
# src/maskformer/hepattn_colliderml/affinity.py, and is named by class_path below. It reaches the
# checkout through the same sync every other file here does.
#
# HOW TO READ THE RESULT, and it is NOT the headline efficiency. One epoch will not move eff@0.5
# much. The number to check is whether the affinity embeddings beat distance at separating
# same-particle pairs -- rerun dias/probe_encoder_affinity.py against this checkpoint and compare
# to the 0.683 / 0.661 baseline. If the gap opens, the relation is learnable and affinity-driven
# chaining becomes available. If it does not, the relation is not learnable from calorimeter cells
# alone at this granularity, which is itself worth reporting.

trainer:
  # One epoch, ~2.9 h -- see overlay_probe_maskattn.yaml for why that is enough to read a shape.
  max_epochs: 1
  logger:
    init_args:
      project: colliderml-calo-probes

model:
  model:
    init_args:
      encoder_tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.experiments.colliderml.affinity.ConstituentAffinityTask
              init_args:
                name: calohit_affinity
                input_constituent: calohit
                target_object: particle
                dim: 256
                affinity_dim: 32
                # 2048 anchors x 12 neighbours ~ 24k pairs per event, against 22k cells. Enough
                # signal per step without making the auxiliary loss the expensive part of training.
                num_anchors: 2048
                num_neighbours: 12
                # The radius the baseline AUC was measured at, so the numbers are comparable.
                radius: 0.06
                # 1.0 against a total loss of ~5. Deliberately not larger: this is an auxiliary
                # signal meant to shape the encoder, and a head that dominates the objective would
                # be testing a different model rather than adding a request to this one.
                loss_weight: 1.0
