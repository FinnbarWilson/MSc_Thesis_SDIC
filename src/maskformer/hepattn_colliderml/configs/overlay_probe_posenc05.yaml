# PROBE ARM 4a: widen the position encoder's correlation length (scale 1 -> 0.5).
#
#   OVERLAY=overlay_probe_posenc05.yaml sbatch src/maskformer/dias/probe_arm.sh
#
# THE HYPOTHESIS, and why it is quantitative rather than a story.
#
# FourierPositionEncoder is Gaussian random features: B ~ N(0, scale^2), features [sin, cos](2*pi*x@B).
# The induced similarity between two cells is exp(-2*pi^2 * scale^2 * d^2) where d is their distance
# in the RAW fields fed to it -- here (r, eta, phi), with r in METRES and eta/phi dimensionless. At
# the default scale of 1, which calo_clustering.yaml never overrides:
#
#   d = 0.05 -> 0.95      d = 0.16 -> 0.60      d = 0.25 -> 0.29      d = 0.50 -> 0.007
#
# so the correlation length is ~0.16 and anything half a unit away is invisible to a query as
# "part of the same object".
#
# Measured on the epoch-6 checkpoint over 150 events, the mask keeps exactly what that kernel can
# see, in BOTH dimensions independently:
#
#   deposited E   true radius   kept radius   true depth span   kept depth span
#   < 0.5 GeV           0.074         0.059            0.154 m          0.042 m
#   1-3                 0.106         0.067            0.293 m          0.048 m
#   > 10 GeV            0.228         0.106            0.418 m          0.011 m
#
# A >10 GeV shower is 0.42 m deep and the mask keeps 1 cm of it. Cells at opposite ends of that
# shower have encoding similarity exp(-2*pi^2*0.42^2) = 0.03. The aperture is not a property of the
# calorimeter or of the loss; it is the bandwidth of the input encoding.
#
# WHAT THIS ARM IS AND IS NOT. It widens the kernel ISOTROPICALLY, which is the cheap discriminator,
# not the proposed fix. The real fix normalises each field to its own physical scale -- equivalent
# to a per-field scale, since dividing field i by k is identical to scaling row i of B by 1/k, and
# doable in data.py without patching upstream. That refinement is only worth building once this arm
# shows the direction is right.
#
# THE COST TO WATCH, WHICH MATTERS AS MUCH AS THE GAIN. 69% of target particles sit in jet cores
# with dr_min < 0.1, against 2.9% above 20 GeV. A wider kernel binds distant cells of one shower but
# also makes two neighbours 0.1 apart look alike, so this can rescue the tail by blurring the bulk.
# dias/compare_probes.py reports low-energy, jet-core and isolated alongside E > 20 for exactly this
# reason: an arm that lifts high energy while dropping the jet core has not helped.
#
# 0.5 gives 1/e similarity at d = 0.45, about one shower. Its bracket partner is
# overlay_probe_posenc02.yaml at 0.2 (1/e at d = 1.1), which is deliberately generous.

trainer:
  # One epoch, ~2.9 h -- see overlay_probe_maskattn.yaml for why that is enough to read the shape.
  max_epochs: 1
  logger:
    init_args:
      project: colliderml-calo-probes

model:
  model:
    init_args:
      # `input_nets` is a LIST, so jsonargparse replaces it wholesale rather than merging -- the
      # same constraint overlay_soft_filter.yaml documents. The whole block is therefore restated.
      # KEEP IN SYNC WITH calo_clustering.yaml; the ONLY intended difference is posenc scale.
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: calohit
                input_dtype: float32
                fields:
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                  - log_energy
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 7
                    hidden_layers: [128]
                    output_size: 256      # anchors do not cross files; *dim in calo_clustering.yaml
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: calohit
                    dim: 256
                    fields:
                      - r
                      - eta
                      - phi
                    scale: 0.5            # <-- THE ONLY CHANGE (default is 1)
