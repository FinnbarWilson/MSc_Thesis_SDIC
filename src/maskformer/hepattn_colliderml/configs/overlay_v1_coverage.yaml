# VARIANT 1: add an energy-COVERAGE term to the mask loss.
#
#   OVERLAYS="overlay_pu200_barrel.yaml overlay_v1_coverage.yaml" ./train_pu200.sh
#
# WHY THIS IS FIRST. It is the only change that optimises the quantity actually reported, and it
# attacks two measured problems at once.
#
#   FRAGMENTATION. DICE is normalised by object size, so covering a 6-cell fragment perfectly
#   scores exactly as well as covering a 38-cell shower perfectly. Nothing prefers one correct
#   large cluster to five correct small ones -- and the model emits 753 clusters per event for 538
#   true particles, a high-energy particle's two largest fragments holding 36% and 16.5%.
#
#   THE THRESHOLD MISMATCH. The metric is "at least half a particle's energy in one cluster". At
#   E > 20 GeV MaskFormer already recovers a HIGHER mean energy fraction than CLUE (0.269 against
#   0.259) yet scores 0.150 against 0.224 on the threshold: it spreads partial credit where the
#   metric rewards commitment.
#
# The coverage term is that metric as a loss -- per matched target, the energy fraction its query
# failed to claim. Weighted by `calohit_loss_weight` so it is ENERGY coverage, matching the metric,
# rather than cell coverage.
#
# WATCH: this rewards claiming more, so expect purity to fall. Read the efficiency-purity curve.

data:
  # REQUIRED for the coverage term to be an ENERGY coverage rather than a cell coverage.
  # `calohit_loss_weight` is all ones unless this power is set, and a coverage term over all-ones
  # weights measures the fraction of CELLS claimed -- not the fraction of energy, which is what the
  # metric uses. Same exponent as overlay_metric_aligned.yaml, chosen there against the cell energy
  # spread. Note it populates the field only; nothing else reads it unless a task names it, so the
  # mask loss itself is untouched and this stays a single change.
  calohit_loss_weight_power: 0.5
  calohit_loss_weight_clip: 10.0

trainer:
  logger:
    init_args:
      project: colliderml-calo-variants

model:
  model:
    init_args:
      # `tasks` is a LIST, so jsonargparse replaces it wholesale -- the whole list is restated.
      # The classification head is verbatim from calo_clustering.yaml.
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 0
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                eval_threshold: 0.2

            # The ONLY change from calo_clustering.yaml: the class, and the one switch named below.
            # ExtendedObjectHitMaskTask with every switch at its default IS ObjectHitMaskTask.
            - class_path: hepattn.experiments.colliderml.mask_variants.ExtendedObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                # MATCHED TO THE PU200 CONTROL, not to pu0. This file was written on DIAS, where
                # calo_clustering.yaml's mask loss is dice 1 + bce 1; on pu200 barrel that exact
                # objective was MEASURED TO COLLAPSE (max mask probability 0.0995 over 113M cells,
                # mean output equal to the target prior, no cell above threshold, so
                # p0.5_calohit_eff is 0 by construction). See commit 6cd7250 and the sweep table in
                # overlay_pu200_barrel.yaml. Because `tasks` is a list, restating it here REPLACES
                # the barrel objective rather than merging into it, so leaving the pu0 weights would
                # have trained the collapsed baseline and made the variant look falsified.
                losses:
                  mask_dice: 20.0
                  mask_focal: 1.0
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: 256
                coverage_weight: 2.0
                coverage_energy_field: calohit_loss_weight
