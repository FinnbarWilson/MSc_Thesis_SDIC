# PROBE ARM 2: put the incidence head back, and change nothing else.
#
#   main.py fit --config configs/calo_clustering.yaml --config configs/overlay_probe_incidence.yaml
#   OVERLAY=overlay_probe_incidence.yaml sbatch src/maskformer/dias/probe_arm.sh
#
# THE HYPOTHESIS THIS TESTS. Measured on run 48247 over events [20250, 20750), the energy budget of
# a particle above 20 GeV:
#
#                   in the matched cluster   in cells NOTHING claims   in another particle's cluster
#   MaskFormer                       0.269                     0.417                          0.313
#   CLUE                             0.259                     0.180                          0.560
#
# 42% of a high-energy particle's energy sits in cells no query claims at ALL, against CLUE's 18%.
# It is not hiding under the working point: dropping the mask threshold from 0.5 to 0.02 -- a 25x
# change -- moves that fraction only to 0.358 and the efficiency from 0.143 to 0.152. The mask head
# is an independent per-(query, cell) sigmoid, so nothing requires the cells to be covered at all.
#
# The incidence head is a SOFTMAX OVER QUERIES per cell. Every cell is therefore assigned to
# something, which removes the failure above by construction rather than by tuning. There is already
# direct evidence: on the epoch-3 checkpoint, scoring the SAME model through incidence rather than
# the mask head lifted E > 20 efficiency from 0.147 to 0.173, purely by changing the assignment rule.
#
# HONEST FRAMING. This is closer to a workaround than to a fix: it does not stop the mask head
# fragmenting, it routes around it with a head that cannot. Arm 1 tests the mechanism itself. Both
# are worth knowing, and they are not exclusive.
#
# THIS ALSO RESTORES `maskformer_incidence` AS A SCOREABLE ALGORITHM -- eval/dump.py writes a store
# with has_incidence true again, so the incidence-head comparison figure gets its MaskFormer side
# back. That is a side effect, not the reason.

trainer:
  # See overlay_probe_maskattn.yaml for why one epoch is enough to read this.
  max_epochs: 1
  logger:
    init_args:
      project: colliderml-calo-probes

model:
  model:
    init_args:
      # `tasks` is a LIST, so jsonargparse replaces it wholesale rather than merging: the whole list
      # has to be restated. THE FIRST TWO ENTRIES ARE VERBATIM FROM calo_clustering.yaml -- the mask
      # objective stays dice 1 + bce 1 with dice alone as the cost, and the classification head is
      # untouched. The third entry is the only addition. This matters: overlay_metric_aligned.yaml
      # restates the same list with dice 5 + focal 20 AND the incidence head, so applying that file
      # would change two things at once and the arm would not be attributable.
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 0
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                eval_threshold: 0.2

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 1.0
                  mask_bce: 1.0
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: 256

            # <-- THE ONLY ADDITION. Taken from the last config that carried it,
            #     git show ee21566:src/maskformer/hepattn_colliderml/configs/calo_clustering.yaml
            - class_path: hepattn.models.task.IncidenceRegressionTask
              init_args:
                name: incidence
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                # 100, not clic's 1.0: kl_div is mean-reduced over the whole [particles x hits]
                # matrix and ours is ~50x sparser, so at 1.0 it contributed ~0.011 against a total
                # of ~28, i.e. nothing.
                #
                # NOTE FOR READING THE LOSS CURVE: this term makes the total loss incomparable to
                # the other two arms and to run 48247's 4.93. Compare the arms by the metrics in
                # dias/compare_probes.py, never by their losses.
                losses:
                  kl_div: 100.0
                # Supervises the loss but is deliberately not a matching cost: kl_div_cost builds a
                # [queries x particles x hits] tensor, which is 86 GB here and OOMs instantly.
                costs: {}
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 256
                    activation: torch.nn.SiLU
                    hidden_layers: 2
                node_net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 256
                    hidden_layers: 1
                has_intermediate_loss: false
