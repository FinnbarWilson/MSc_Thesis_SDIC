# VARIANT 3: one message-passing step on the mask logits.
#
#   OVERLAYS="overlay_pu200_barrel.yaml overlay_v3_propagation.yaml" ./train_pu200.sh
#
# THE STRUCTURAL ONE, and what the whole investigation points at. The mask logit is a dot product
# between a query and a SINGLE cell, so a cell can only ask "do I look like this query" and never
# "am I attached to a cell that does". A calorimeter shower is defined by connectivity across
# physically diverse cells -- 0.42 m of depth and 0.23 in angle at high energy -- which is the
# second question, not the first.
#
# The consequences, all measured: the matched cluster holds ~6 cells whether the particle deposits
# 13 or 38 and shrinks as showers grow; it spans ~0.06 in angle and ~1 cm of a 42 cm shower; and
# SIX previous interventions (masked attention off, incidence head, exclusive targets, two
# positional bandwidths, an auxiliary affinity head) moved none of it.
#
# This adds `logit_i <- logit_i + lambda * mean(logit_j over neighbours j)`, turning the question
# into "do I, or does my neighbourhood". It is the smallest change that gives the head a relational
# term at all, and unlike the affinity head it acts directly on the assignment rather than hoping
# to reshape the encoder.
#
# WATCH: propagation blurs boundaries as well as filling gaps. In a jet core the median distance to
# the next particle is 0.008 against a 0.23 shower radius, so too large a lambda or radius will
# merge neighbours. 0.5 / 0.06 m is a starting point, not a tuned value.

trainer:
  logger:
    init_args:
      project: colliderml-calo-variants

model:
  model:
    init_args:
      # `tasks` is a LIST, so jsonargparse replaces it wholesale -- the whole list is restated.
      # The classification head is verbatim from calo_clustering.yaml.
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 0
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                eval_threshold: 0.2

            # The ONLY change from calo_clustering.yaml: the class, and the one switch named below.
            # ExtendedObjectHitMaskTask with every switch at its default IS ObjectHitMaskTask.
            - class_path: hepattn.experiments.colliderml.mask_variants.ExtendedObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 1.0
                  mask_bce: 1.0
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: 256
                propagation_lambda: 0.5
                propagation_neighbours: 8
                propagation_radius: 0.06
