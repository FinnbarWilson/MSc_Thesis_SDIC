# Sweep arm B: dice only
#
# One of three arms; the shared rationale, sizing and success criterion are in
# overlay_sweep_short.yaml. `tasks` is a LIST, so jsonargparse replaces it wholesale rather than
# merging -- the whole list is restated here and the ONLY difference between arms is the mask
# head's `losses` block. Costs are dice-only in every arm, unchanged from calo_clustering.yaml.
#
# THE CONTROL ON THE HYPOTHESIS. No negative-dominated term at all, so this arm CANNOT collapse
# to the prior by construction. If it still produces no cells above 0.5, the problem is not class
# imbalance and the whole reweighting line of attack is wrong -- which is worth knowing for the
# cost of one 2 h run. Expect soft, poorly-calibrated masks even if it works; dice alone has no
# per-cell confidence term.

model:
  model:
    init_args:
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 0
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                eval_threshold: 0.2

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 1.0
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: 256
