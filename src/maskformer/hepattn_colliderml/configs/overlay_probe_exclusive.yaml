# PROBE ARM 3: make the mask target the exclusive partition, and change nothing else.
#
#   main.py fit --config configs/calo_clustering.yaml --config configs/overlay_probe_exclusive.yaml
#   OVERLAY=overlay_probe_exclusive.yaml sbatch src/maskformer/dias/probe_arm.sh
#
# THIS REPLACED AN EARLIER ARM 3 THAT WAS INVALID. The plan had been to cut num_queries from 1000 to
# 600 to discourage over-segmentation. Measured on the 500 scored events, the target count per event
# is mean 538, median 512, p95 936, max 1000 -- and 32% OF EVENTS CARRY MORE THAN 600 TARGETS. Since
# event_max_num_particles must equal num_queries, cutting to 600 would silently drop real targets in
# a third of the sample, changing the denominator of every efficiency. The arm would have measured a
# different experiment, not a different model.
#
# THE HYPOTHESIS THIS TESTS. `particle_calohit_valid` marks a cell True for EVERY particle that
# contributed to it, so the mask head is explicitly trained to claim cells it does not dominate.
# overlay_metric_aligned.yaml records the consequence, measured on the epoch-3 checkpoint: the model
# divides each cell 2.04 ways against truth's 1.22, and that over-division survives every mask
# threshold up to 0.95, so it is a property of the target rather than a working point. Over-division
# is the same coin as fragmentation -- if several queries are each taught to claim a shared cell,
# several queries end up owning parts of the same shower.
#
# The scorer, meanwhile, always evaluates an exclusive partition, because CLUE produces one and
# cannot do otherwise. So the head is marked down for doing what it was trained to do. Exclusive
# truth keeps ~83% of (particle, cell) associations carrying ~94% of each particle's own energy, so
# this gives up little.
#
# WHAT THIS ARM DELIBERATELY DOES NOT DO. overlay_metric_aligned.yaml bundles this flag with
# energy-weighted DICE and a restated task list that reintroduces the incidence head and the focal
# term. Applying that file would change four things at once. It is also worth recording that its
# headline argument -- that the loss counts cells while the metric weights energy, and that this is
# "the likeliest reason" for the high-energy deficit -- IS NOT SUPPORTED by the 2026-08-06
# measurement: eff_e exceeds eff_n in every energy bin for both algorithms (0.313 against 0.167 at
# E > 20), so the model already captures energetic cells preferentially rather than ignoring them.
# The exclusive-target half of that overlay is the part this evidence still backs, and it is the
# only part applied here.

data:
  # Build `particle_calohit_valid` as the exclusive (max-energy) partition. Derived from
  # `particle_incidence` rather than recomputed, so it agrees by construction with the scorer's
  # definition of exclusive truth. THE ONLY CHANGE IN THIS FILE.
  particle_calohit_exclusive: true

trainer:
  # See overlay_probe_maskattn.yaml for why one epoch is enough to read this.
  max_epochs: 1
  logger:
    init_args:
      project: colliderml-calo-probes
