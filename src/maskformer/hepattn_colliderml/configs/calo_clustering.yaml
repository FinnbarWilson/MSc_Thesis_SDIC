# Calorimeter clustering on ColliderML. Measurements behind each choice are in the annotated
# version of this file: git show ba0319c:src/maskformer/hepattn_colliderml/configs/calo_clustering.yaml
name: ColliderML_Calo_Clustering

data:
  train_dir: /home/xucapfwi/ColliderML_data/ttbar_pu0/
  val_dir: /home/xucapfwi/ColliderML_data/ttbar_pu0/
  test_dir: /home/xucapfwi/ColliderML_data/ttbar_pu0/

  event_type: ttbar
  dataset_prefix: ttbar_pu0
  calo_only: true

  batch_size: 1
  input_sort_field: phi
  num_workers: 10
  num_train: 20000
  num_val: 250
  num_test: 500

  train_start_event: 0
  val_start_event: 20000
  test_start_event: 20250

  # Zero-suppression. 1e-3 removed ~84% of hits and shredded clusters (median hits/particle 15->4);
  # 2e-4 keeps them intact at ~22k hits/event.
  calohit_min_energy: 2.0e-4

  particle_min_pt: 0.5
  particle_max_abs_eta: 4.0

  particle_hit_cuts: {}

  particle_include_charged: true
  particle_include_neutral: true

  # Particles depositing 1-2 calo hits are not reconstructable but still sat in the efficiency
  # denominator. Drops ~15% of targets, keeps 97.7% of the calorimeter energy.
  particle_min_num_calohits: 3

  # Must equal model...decoder.num_queries below.
  event_max_num_particles: &num_objects 1000

  return_calohits: true
  return_tracks: false

trainer:
  max_epochs: 4
  # Sum gradients over 4 events, then take one optimiser step: the statistical benefit of batch 4
  # at the memory cost of batch 1 (batch 4 OOMs an 80GB A100 at ~22k hits/event). Lion uses only
  # the SIGN of the gradient, which is too noisy at batch 1. Divides optimiser steps by 4, which is
  # why lrs_config.max below is raised to match - the two settings are only valid together.
  accumulate_grad_batches: 4
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 10
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: true
  val_check_interval: 0.25

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      workspace: finnbarwilson
      project: colliderml-calo-clustering
      online: true

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        log_model: false
        every_n_epochs: 1
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  optimizer: lion

  lrs_config:
    initial: 1e-5
    # 1e-4, sqrt(4)-scaled from 5e-5 to compensate for accumulate_grad_batches: 4 above. Only valid
    # together with it - 1e-4 thrashed and 1.5e-4 diverged at batch 1.
    max: 1e-4
    end: 1e-6
    pct_start: 0.01
    skip_scheduler: false
    weight_decay: 1e-5

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      # configs/overlay_*.yaml hardcode this value - YAML anchors do not cross files.
      dim: &dim 256
      # The encoder sorts constituents by this before windowed attention, so it decides which hits
      # share a window.
      input_sort_field: phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: calohit
                input_dtype: float32
                # log_energy, not total_energy: InputNet applies no normalisation, and raw
                # total_energy is ~1000x smaller than the O(1) coordinates, so the single most
                # important feature for calo clustering was numerically drowned out.
                fields:
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                  - log_energy
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 7
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                # FourierPositionEncoder, not PositionEncoder: the latter's default frequencies
                # alias at the scale that matters here (a shower spans ~0.007 in eta), giving hits
                # of the same particle decorrelated encodings. Measured 2.3x more locality signal.
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: calohit
                    dim: *dim
                    fields:
                      - r
                      - eta
                      - phi

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 4
          dim: *dim
          attn_type: flash-varlen
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      decoder:
        num_decoder_layers: 4
        num_queries: *num_objects
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 1.0
                dim: *dim
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                # A true particle only counts as reconstructed if its matched query is also accepted
                # here, and the default is an argmax at 0.5. Swept post-hoc: 0.2 gave +25% relative
                # efficiency at flat purity. Affects prediction and metrics only, not the loss.
                eval_threshold: 0.2

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 5.0
                  mask_focal: 20.0
                costs:
                  mask_dice: 5.0
                  mask_focal: 20.0
                null_weight: 1.0
                dim: *dim

            # Third head, not in the tracking configs. Predicts I_ia = E_ia/E_i, the fraction of
            # each cell's energy belonging to each particle (softmax over particles). Energy
            # conserving by construction, and unlike the binary mask above it can represent a cell
            # shared between several particles - 12.6% of our hits. Ported from experiments/clic.
            - class_path: hepattn.models.task.IncidenceRegressionTask
              init_args:
                name: incidence
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                # 100, not clic's 1.0: kl_div is mean-reduced over the whole [particles x hits]
                # matrix and ours is ~50x sparser, so at 1.0 it contributed ~0.011 against a total
                # of ~28, i.e. nothing.
                losses:
                  kl_div: 100.0
                # Supervises the loss but is deliberately not a matching cost: kl_div_cost builds a
                # [queries x particles x hits] tensor, which is 86 GB here and OOMs instantly.
                costs: {}
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    hidden_layers: 2
                node_net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    hidden_layers: 1
                has_intermediate_loss: false
