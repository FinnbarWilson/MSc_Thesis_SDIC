# pu0 on ce-ai-1, with the DICE-DOMINANT mask objective that pu200 uses.
#
#   main.py fit --config configs/calo_clustering.yaml --config configs/overlay_pu0_dice.yaml
#
# THE ONE THING BEING TESTED
#
# calo_clustering.yaml trains pu0 with `mask_dice: 1.0 + mask_bce: 1.0`. On pu200 barrel that
# exact objective was measured to COLLAPSE -- the mask head converged to emitting the target
# prior everywhere (max mask probability 0.0995 over 113M cells, no cell above threshold) -- and
# a three-arm sweep found focal's presence, not its weight, was what prevented it. pu200 now runs
# `mask_dice: 20.0 + mask_focal: 1.0`.
#
# pu0 does NOT collapse under dice+bce: it trains, and results/pu0/ is built from it. Its target
# is ~2.3x denser (positive rate ~4.1e-04 against pu200 barrel's 1.81e-04), which is the likeliest
# reason. So this run is not a rescue, it is a question: does the objective that pu200 needed also
# help where the old one already works?
#
# EVERYTHING ELSE IS DELIBERATELY UNCHANGED from calo_clustering.yaml -- same cuts, same 1000
# queries, same num_train, same 7-epoch schedule, same seed. The mask loss is the only variable
# against the existing pu0 baseline, which is what makes the two comparable. In particular
# num_train stays at 20,000 even though 100,000 events are now on disk: overlay_long_schedule.yaml
# records that this model is step-starved rather than data-starved (two runs at ~20,000 steps
# reached nearly the same validation loss despite 6.7x different data volumes), and changing the
# data volume in the same run as the objective would confound the two.
#
# WHAT WOULD MAKE THIS RUN INTERESTING. pu200's gain from dice-dominance was not efficiency, it
# was that the head stopped over-claiming: masks went from 2.1x to 1.3x oversized and purity rose
# 0.202 -> 0.319 -> 0.432 across 4k/12k/30k steps. The pu0 figure to watch is therefore purity and
# the cluster-size-versus-energy slope, not efficiency alone.

data:
  # The dataset downloaded to this machine on 2026-08-10: 100 shards of 1,000 events each.
  # NOTE pu0 packs 1,000 events per shard against pu200's 100, so this is 100,000 events from
  # 100 GB -- see the EVENTS_PER_SHARD note in setup/download_data.py.
  # calo_clustering.yaml still points at /home/xucapfwi/, which is the DIAS path and does not
  # exist here; overriding rather than editing it keeps that file valid on DIAS.
  train_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu0/
  val_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu0/
  test_dir: /mnt/ai-datastore/finnbar/ColliderML_data/ttbar_pu0/

  # 24, matching the DIAS run this is compared against (32 CPUs / 24 workers, measured
  # 1.94 events/s). This box has 104 cores, so the workers are not competing for them.
  #
  # row_group_cache_size is left at data.py's default of 8, unlike pu200 which lowers it to 3: a
  # pu0 shard is ~790 MB on disk against pu200's ~2.9 GB, so the same 8 slots cost far less here.
  # Watch host RSS on the first hour anyway -- a pu0 shard holds 1,000 events, so one cached row
  # group is a bigger object than the shard size suggests.
  num_workers: 24

model:
  model:
    init_args:
      # `tasks` is a LIST, so jsonargparse replaces it wholesale rather than merging -- the whole
      # list has to be restated. KEEP IN SYNC WITH calo_clustering.yaml; the ONLY intended
      # difference is the mask head's `losses` block.
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 0
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                # Stale here for the same reason it is stale at pu200: swept against a different
                # objective. Affects prediction and metrics only, never the loss, so it is safe to
                # leave and re-sweep afterwards with scripts/sweep_pred_threshold.py.
                eval_threshold: 0.2

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                # THE CHANGE. Was dice 1.0 + bce 1.0.
                #
                # Chosen at pu200 from a measured three-arm sweep, where dice 20 + focal 1 and
                # dice 5 + focal 20 were statistically indistinguishable and both beat the two
                # arms without focal. Dice-dominance won a tie on mechanism: dice governs
                # predicted SET SIZE and over-prediction was the remaining failure. Carrying the
                # same weights here keeps the two pileup conditions on one objective.
                losses:
                  mask_dice: 20.0
                  mask_focal: 1.0
                # Dice-only, as at pu200, and as the CLD experiment does (it comments its
                # `mask_bce: 1.0` cost out and keeps `mask_dice: 1.0`).
                #
                # CORRECTION 2026-08-12: an earlier version of this comment claimed loss.py has
                # no `mask_bce` entry in cost_fns and that BCE therefore COULD NOT be a matching
                # cost. That is false -- loss.py:392 registers it. Dice-only is a choice here,
                # not a constraint, and it happens to be the same choice CLD made.
                costs:
                  mask_dice: 1.0
                null_weight: 1.0
                dim: 256
