model:
  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.InputNet
            init_args:
              input_name: calohit
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 7
                  output_size: 256
                  hidden_layers:
                  - 128
                  hidden_dim_scale: 2
                  activation:
                    class_path: hepattn.models.SwiGLU
                  final_activation: null
                  dropout: 0.0
                  bias: true
              fields:
              - x
              - y
              - z
              - r
              - eta
              - phi
              - log_energy
              posenc:
                class_path: hepattn.models.FourierPositionEncoder
                init_args:
                  input_name: calohit
                  dim: 256
                  fields:
                  - r
                  - eta
                  - phi
                  scale: 1.0
              input_dtype: float32
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 4
          dim: 256
          attn_type: flash-varlen
          window_size: 1024
          window_wrap: true
          score_mod: null
          value_residual: false
          num_register_tokens: null
          attn_kwargs:
            bias: false
          norm: FastLayerNorm
          layer_scale: null
          drop_path: 0.0
          qkv_norm: false
          hybrid_norm: true
          dense_kwargs:
            activation: SwiGLU
