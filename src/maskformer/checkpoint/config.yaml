        init_args:
          num_queries: 1000
          decoder_layer_config:
            dim: 256
            norm: FastLayerNorm
            hybrid_norm: true
            dense_kwargs:
              activation: SwiGLU
            attn_kwargs:
              bias: false
          num_decoder_layers: 4
          mask_attention: true
          use_query_masks: false
          posenc: null
          local_strided_attn: false
          window_size: 512
          window_wrap: true
          fast_local_ca: false
          block_size: 128
          unified_decoding: false
          phi_shift: 0.0
          unmask_all_false: true
          dynamic_queries: false
          dynamic_query_source: null
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
