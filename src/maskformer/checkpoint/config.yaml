                init_args:
                  input_size: 256
                  output_size: null
                  hidden_layers: 1
                  hidden_dim_scale: 2
                  activation: null
                  final_activation: null
                  dropout: 0.0
                  bias: true
              has_intermediate_loss: false
      dim: 256
      target_object: particle
      pooling: null
      matcher:
