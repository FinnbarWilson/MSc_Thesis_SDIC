              name: flow_calohit_assignment
              input_constituent: calohit
              input_object: query
              output_object: flow
              target_object: particle
              losses:
                mask_dice: 5.0
                mask_focal: 20.0
              costs:
                mask_dice: 5.0
                mask_focal: 20.0
              dim: 256
              object_net: null
              constituent_net: null
              null_weight: 1.0
              mask_attn: true
              target_field: valid
              logit_scale: 1.0
              pred_threshold: 0.5
              mask_attention_threshold: null
              has_intermediate_loss: true
