# Overlay: train the model for long enough to find out what it can do.
#
#   main.py fit --config configs/calo_clustering.yaml --config configs/overlay_long_schedule.yaml
#
# THE EVIDENCE THAT THE MODEL IS UNDERTRAINED, NOT SATURATED
#
# Run 48169 (4 epochs, 20000 events) never plateaued. Its checkpoints, in order:
#   22.77  21.22  20.46  20.02  19.65  19.45  19.27  18.97
#   18.84  18.79  18.63  18.37  18.29  18.21  18.13  18.06
# Validation loss was still falling at the final checkpoint. Training stopped because max_epochs
# was 4, not because the model had stopped learning.
#
# The confirmation is a coincidence worth stating, because it separates "more data" from "more
# optimisation". The previous run used 3000 events for 28 epochs; this one used 20000 for 4:
#   3000 x 28 / 4 accumulation  = 21,000 optimiser steps -> val_loss 18.26
#   20000 x 4  / 4 accumulation = 20,000 optimiser steps -> val_loss 18.06
# Nearly the same step count and nearly the same loss, despite 6.7x more unique data. Performance
# is tracking OPTIMISER STEPS, and 20k of them is very few for a 10.4M-parameter set-prediction
# model resolving 1000 queries. More data is not what is missing; more steps is.
#
# WHY accumulate_grad_batches IS LEFT AT 4
#
# Raising it was considered and rejected on the arithmetic. Accumulation divides optimiser steps by
# its own value, so at a fixed walltime going 4 -> 16 would have cut this run from 60k steps to 15k
# -- fewer than the run being diagnosed as step-starved. The usual argument for raising it (Lion
# uses only the SIGN of the gradient, so a noisy single-event gradient makes the model wander)
# already motivated the move from 1 to 4, and there is no evidence 4 is insufficient: the loss
# trajectory above is smooth and monotonic, with none of the thrashing seen at accumulation 1.
# Leave it at 4 unless a run actually becomes unstable.
#
# THIS RUN DOES NOT FIT IN ONE JOB, AND THAT IS DELIBERATE
#
# Measured end-to-end on job 48169: 4.92 h/epoch at num_train=20000 (1.13 events/s sustained, ~20%
# slower than the 1.42 the previous sizing assumed -- use the measured figure). So:
#     12 epochs x 4.92 h = ~59 h, against a 20 h walltime cap.
# Run it as THREE sequential 20 h jobs, resuming each time:
#     sbatch slurm/calo_clustering.sh                                     # job 1, epochs 0-3
#     CKPT=logs/<run>/ckpts/<last>.ckpt sbatch slurm/calo_clustering.sh   # job 2, epochs 4-7
#     CKPT=logs/<run>/ckpts/<last>.ckpt sbatch slurm/calo_clustering.sh   # job 3, epochs 8-11
# (the script already forwards CKPT to --ckpt_path). Lightning restores the optimiser AND scheduler
# state, so the OneCycle schedule below is sized once across all twelve epochs and the decay lands
# in job 3 where it belongs.
#
# THE FAILURE MODE TO AVOID. OneCycleLR is sized from TOTAL steps. A run that stops early never
# reaches its decay phase, so its final checkpoint is taken at a high learning rate -- which is
# exactly how the hit-filter run was wasted. If you only intend to run one or two jobs, LOWER
# max_epochs to match, rather than letting a 12-epoch schedule be truncated at epoch 4. Equally, do
# not compare a truncated run against a completed one; compare at equal steps or not at all.

trainer:
  # 12 epochs x 20000 events / 4 accumulation = 60,000 optimiser steps, 3x run 48169's 20,000.
  # Raise further if the walltime budget allows -- nothing measured so far suggests this is where
  # the curve flattens, only that it is further along it than 20k.
  max_epochs: 12

  # Unchanged from calo_clustering.yaml, restated because the reasoning above depends on it and a
  # reader should not have to hold two files in their head to check the step arithmetic.
  accumulate_grad_batches: 4

model:
  lrs_config:
    initial: 1.0e-5
    # 1e-4 unchanged. It is a property of the batch statistics (accumulation 4), not of the run
    # length, and it trained smoothly for 4 epochs -- which was the open question when it was
    # raised from 5e-5, and is now answered.
    max: 1.0e-4
    end: 1.0e-6
    # 0.01 of 60k steps = 600 warmup steps, against 200 in the 4-epoch run. Warmup should scale
    # with the run, and a fraction does that automatically, which is why this stays a fraction
    # rather than becoming an absolute count.
    pct_start: 0.01
    skip_scheduler: false
    weight_decay: 1.0e-5
