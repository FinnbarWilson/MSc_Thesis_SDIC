# Overlay: make the training objective agree with the reported metric.
#
#   main.py fit --config configs/calo_clustering.yaml --config configs/overlay_metric_aligned.yaml
#
# WHY, measured rather than assumed
#
# The scored result and the trained objective disagreed in two ways, both of which show up in the
# CLUE comparison as MaskFormer losing ground exactly where the metric is most sensitive.
#
#   1. EVERY REPORTED NUMBER IS ENERGY-WEIGHTED; THE LOSS COUNTED CELLS.
#      DICE and focal treat a 1 MeV cell and a 1 GeV cell identically, but a calorimeter measures
#      energy, not occupancy, and cell energies here span orders of magnitude (median 4.6e-4 GeV in
#      ECAL against shower cores three decades above). So the model was optimising occupancy and
#      being scored on energy. This is the likeliest reason the model beats CLUE below ~2 GeV and
#      loses to it above: at E > 20 GeV MaskFormer scores 0.147 against CLUE's 0.224, and energetic
#      particles are exactly the ones whose energy is concentrated in a few cells the loss barely
#      noticed.
#
#   2. THE MASK HEAD WAS TRAINED ON MULTI-OWNER TRUTH AND SCORED ON AN EXCLUSIVE PARTITION.
#      `particle_calohit_valid` marks a cell True for EVERY particle that contributed to it, so the
#      mask head was explicitly taught to claim cells it does not dominate. The head-to-head then
#      scores an exclusive partition -- it has to, because CLUE produces one and cannot do otherwise
#      -- and marks it down for having done so. Exclusive truth keeps ~83% of (particle, cell)
#      associations carrying ~94% of each particle's own energy, so this gives up little and removes
#      a mismatch that was costing purity outright.
#
# WHAT THIS DOES NOT CHANGE, ON PURPOSE
#
# `particle_incidence` is untouched and stays fractional. The incidence head is where a shared cell
# is represented, and it is supervised on the real energy division; making the MASK target exclusive
# does not make the model a partitioner, it stops the mask head being scored for a job the incidence
# head already does better. Measured on the epoch-3 checkpoint: the model divides each cell 2.04
# ways against truth's 1.22, and that over-division survives every mask threshold up to 0.95, so it
# is a calibration problem in the mask head rather than a working point.
#
# EXPECT THIS TO CHANGE THE NUMBERS, INCLUDING DOWNWARDS AT LOW ENERGY. Energy weighting moves
# effort from the many soft cells to the few hard ones, which is the intended trade. Compare against
# the epoch-3 baseline at EQUAL OPTIMISER STEPS, not at equal epochs.

data:
  # Exponent on the calibrated cell energy, then normalised to mean 1 across the event.
  #
  # 0.5, not 1.0, and the reason is variance rather than taste. Raw energy as a BCE weight hands a
  # handful of cells per event almost all of the gradient, which is a sampling problem dressed up as
  # emphasis; Lion only sees the SIGN of the gradient, so a few dominant cells would decide the
  # direction of the whole step. The square root keeps the ordering while compressing the range.
  # Measured on test event 20250: mean 1.000, min 0.497, max 8.82, nothing hitting the clip.
  calohit_loss_weight_power: 0.5
  # Safety valve on the tail, in units of the mean. Nothing reached it in the events checked, so it
  # should never bite; if it starts biting, the energy distribution has changed and that is worth
  # knowing rather than silently clamping.
  calohit_loss_weight_clip: 10.0

  # Build `particle_calohit_valid` as the exclusive (max-energy) partition. Derived from
  # `particle_incidence` rather than recomputed, so it agrees by construction with the scorer's
  # definition of exclusive truth and with the incidence head's own target.
  particle_calohit_exclusive: true

model:
  model:
    init_args:
      # `tasks` is a LIST, so jsonargparse replaces it wholesale rather than merging -- the same
      # constraint documented in overlay_soft_filter.yaml for `input_nets`. The whole list therefore
      # has to be restated. KEEP IN SYNC WITH calo_clustering.yaml; the only differences are in
      # ObjectHitMaskTask, and they are marked below.
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 1.0
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
                eval_threshold: 0.2

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_calohit_assignment
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                # CHANGED: mask_dice -> mask_dice_weighted, so the DICE term responds to the cell
                # weighting too. Plain `mask_dice` documents that it ignores sample weights, and it
                # does; leaving it would have energy-weighted only the focal term. The weighted
                # version reduces exactly to the plain one under a uniform weight, which is
                # asserted in the tests, so this is not a change of objective on its own.
                losses:
                  mask_dice_weighted: 5.0
                  mask_focal: 20.0
                # Costs stay UNWEIGHTED, deliberately. Matching decides which query owns which
                # target, which is a question about correspondence; the weighting is about how much
                # a cell counts once that correspondence is fixed. Tasks call cost functions without
                # a sample weight anyway, so `mask_dice_weighted` resolves to the same cost.
                costs:
                  mask_dice: 5.0
                  mask_focal: 20.0
                null_weight: 1.0
                dim: 256
                # CHANGED: the per-cell weight built in data.py from calibrated cell energy.
                # All ones when calohit_loss_weight_power is 0, so naming it here is safe even if
                # the data block above is reverted -- the weighting switches off, nothing breaks.
                constituent_weight_field: calohit_loss_weight

            - class_path: hepattn.models.task.IncidenceRegressionTask
              init_args:
                name: incidence
                input_constituent: calohit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  kl_div: 100.0
                costs: {}
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 256
                    activation: torch.nn.SiLU
                    hidden_layers: 2
                node_net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 256
                    hidden_layers: 1
                has_intermediate_loss: false
