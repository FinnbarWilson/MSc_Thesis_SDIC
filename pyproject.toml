# Tool configuration only. The environment itself is conda's -- see environment.yml -- because
# CLUEstering has to compile against Boost headers and a pip-only install of this project does
# not get that right. Nothing here declares dependencies or makes the repository installable;
# scripts run as `python -m scripts.<name>` from the root, which is what puts `src` on the path.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Report skips by default. Most of the suite needs an event store that is not on a laptop, so
# a bare "23 passed" would otherwise read as full coverage when half the tests never ran.
addopts = "-ra"
# src/maskformer/ mirrors a hepattn experiment directory: its files import torch, lightning and
# hepattn, none of which are installed in the analysis environment. It holds no tests and should
# not be walked looking for them.
norecursedirs = ["src/maskformer", ".git", "results", "figures"]
